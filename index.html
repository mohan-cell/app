<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mytv</title>
    
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="app.css">

    <style>
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        #infoOverlay {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(5px);
            padding: 10px 20px; border-radius: 30px; color: white;
            display: flex; gap: 15px; align-items: center;
            border: 1px solid var(--primary);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            transition: opacity 0.8s ease-out;
        }

        #appSection { width: 100vw; height: 100vh; position: relative; }

        #splashScreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 99999;
            display: none; justify-content: center; align-items: center;
            transition: opacity 1s ease-out;
        }
        #splashScreen img {
            max-width: 60%; max-height: 60%; object-fit: contain;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.05); }
            100% { transform: scale(0.95); }
        }
    </style>
</head>
<body>
    
    <div class="card" id="authSection" style="width: 90%; max-width: 400px; text-align:center;">
        <h2 style="color:var(--primary); margin-bottom:1rem;">Device Activation</h2>
        <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1.5rem;">Enter your 10-digit coupon code to activate or renew this device.</p>
        <div class="form-group">
            <input type="text" id="activationCode" placeholder="Enter Code" style="text-align: center; letter-spacing: 2px;" autocomplete="off" tabindex="1">
        </div>
        <button id="activateBtn" class="btn btn-primary" style="width:100%" onclick="activate()" tabindex="2">Unlock Device</button>
    </div>

    <div id="splashScreen">
        <img id="splashLogo" src="" alt="Reseller Logo">
    </div>

    <div id="appSection" style="display: none;">
        <div id="infoOverlay">
            <span class="badge active" id="tierDisplay" style="margin:0;">Standard</span>
            <span style="font-size: 0.9rem; color: #ccc;">Valid Until: <strong id="expiryDisplay" style="color: white;"></strong></span>
        </div>

        <div id="player-container">
            <div id="loader" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; z-index: 15;">Loading...</div>
            <video id="video-player" controls autoplay></video>
            <iframe id="iframe-player" allowfullscreen style="display: none;"></iframe>
            <div id="interaction-overlay"></div>
            

            <div id="sidebar">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search Channels or Groups..." autocomplete="off">
                </div>
                <div id="channel-list"></div>
            </div>
            
        </div>
    </div>

    <script>
        const client = supabase.createClient('https://yhxhmxawgaovzyxwookw.supabase.co', 'sb_publishable_jhU4EFNFX3ZtrmrgRfYlUQ_OfjA6Rym');
        

        function generateUUID() {
            if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
                return crypto.randomUUID();
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        let device = JSON.parse(localStorage.getItem('mytv_device'));
        if (!device || !device.id) { 
            device = { id: generateUUID(), role: null }; 
            localStorage.setItem('mytv_device', JSON.stringify(device)); 
        }


        function showToast(msg, isError = false) {
            const toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.position = 'fixed';
            toast.style.top = '20px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.backgroundColor = isError ? '#ef4444' : '#22c55e';
            toast.style.color = 'white';
            toast.style.padding = '12px 24px';
            toast.style.borderRadius = '8px';
            toast.style.zIndex = '9999999';
            toast.style.fontWeight = 'bold';
            toast.style.boxShadow = '0 4px 12px rgba(0,0,0,0.5)';
            toast.style.textAlign = 'center';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        async function activate() {
            const code = document.getElementById('activationCode').value.trim();
            if (!code) return showToast("Please enter a code.", true);
            
            const { data, error } = await client.rpc('activate_device', { p_device_id: device.id, p_code: code });
            
            if (error || !data.success) return showToast(error?.message || data.error, true);
            
            if (data.device_id) device.id = data.device_id;
            device.role = 'user'; 
            localStorage.setItem('mytv_device', JSON.stringify(device)); 
            
            showToast(`Success! Unlocked ${data.tier} tier until ${new Date(data.expiry).toLocaleDateString()}`);
            document.getElementById('activationCode').value = ''; 
            checkAccess();
        }

        async function checkAccess() {
            if (device.role === 'user') { 
                const { data, error } = await client.from('devices').select('*').eq('id', device.id).single();
                if (data && new Date(data.expiry_date) > new Date()) {
                    document.getElementById('authSection').style.display = 'none'; 
                    document.getElementById('appSection').style.display = 'block';
                    document.getElementById('tierDisplay').innerText = data.current_tier;
                    document.getElementById('expiryDisplay').innerText = new Date(data.expiry_date).toLocaleDateString();
                    
                    await loadResellerSettings();

                    const infoOverlay = document.getElementById('infoOverlay');
                    infoOverlay.style.display = 'flex'; infoOverlay.style.opacity = '1';
                    setTimeout(() => {
                        infoOverlay.style.opacity = '0';
                        setTimeout(() => infoOverlay.style.display = 'none', 800);
                    }, 5000);

                } else {
                    if (data) showToast("Your device subscription has expired. Please enter a new code to renew.", true);
                    document.getElementById('authSection').style.display = 'block'; 
                    document.getElementById('appSection').style.display = 'none';
                    setTimeout(() => document.getElementById('activationCode').focus(), 100);
                }
            } else {
                document.getElementById('authSection').style.display = 'block'; 
                document.getElementById('appSection').style.display = 'none';
                setTimeout(() => document.getElementById('activationCode').focus(), 100);
            }
        }

        async function loadResellerSettings() {
            const { data: cData } = await client.from('coupons').select('creator_id').eq('redeemed_by', device.id).single();
            if (cData) {
                const { data: sData } = await client.from('reseller_settings').select('*').eq('reseller_id', cData.creator_id).single();
                if (sData) {
                    if (sData.logo_url) {
                        const splash = document.getElementById('splashScreen');
                        document.getElementById('splashLogo').src = sData.logo_url;
                        splash.style.display = 'flex';
                        splash.style.opacity = '1';
                        setTimeout(() => {
                            splash.style.opacity = '0';
                            setTimeout(() => splash.style.display = 'none', 1000); 
                        }, 5000); 
                        
                        const videoEl = document.getElementById('video-player');
                        if(videoEl) videoEl.poster = sData.logo_url;
                    }

                    if (sData.playlist_url) {
                        setTimeout(() => {
                            if (typeof window.startTvApp === 'function') window.startTvApp(sData.playlist_url);
                        }, 500); 
                    }
                }
            }
        }
        
        checkAccess();
    </script>
</body>
</html>
